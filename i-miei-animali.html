
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I miei animali - Angel Zampetta Amica</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4faf5;
      padding: 20px;
      color: #243b2c;
    }
    main {
      max-width: 550px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }
    h1 { color: #287b49; }
    label { display: block; margin-top: 16px; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      background: #287b49;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>🐾 I miei animali</h1>
    <p>Presenta il tuo animale a chi se ne prenderà cura.</p>

    <label for="nome">Nome dell'animale</label>
    <input id="nome" type="text" placeholder="Es. Angel">

    <label for="specie">Che animale è?</label>
    <select id="specie">
      <option value="Cane">Cane</option>
      <option value="Gatto">Gatto</option>
      <option value="Coniglio">Coniglio</option>
      <option value="Uccellino">Uccellino</option>
      <option value="Altro">Altro</option>
    </select>

    <label for="eta">Età</label>
    <input id="eta" type="text" placeholder="Es. 5 anni">

    <label for="peso">Peso (kg)</label>
    <input id="peso" type="number" min="0" step="0.1">

    <label for="foto">Foto dell'animale</label>
    <input id="foto" type="file" accept="image/*">

    <label for="carattere">Carattere e comportamento</label>
    <textarea id="carattere" rows="4"
      placeholder="È socievole? Timoroso? Va d'accordo con altri animali?"></textarea>

    <label for="esigenze">Abitudini ed esigenze particolari</label>
    <textarea id="esigenze" rows="4"
      placeholder="Alimentazione, farmaci, allergie, passeggiate e altre informazioni importanti..."></textarea>

   <button id="salva-animale" type="button">💚 Salva il mio animale</button>
    <p>Qui puoi registrare il tuo animale e salvare le sue informazioni.</p>
    <h2>🐾 I miei animali registrati</h2>
<div id="lista-animali"></div>
<p id="messaggio-lista"></p>
  </main>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const supabaseClient = supabase.createClient(
    'https://svudedpkugiehiezfupd.supabase.co',
    'sb_publishable_g05v_CHcx1c-ua7J36IKog_nnTxaJUB'
  );

document.getElementById('salva-animale').addEventListener('click', async function () {
  const { data: { user }, error: erroreAccesso } =
    await supabaseClient.auth.getUser();

  if (erroreAccesso || !user) {
    alert('Devi effettuare l’accesso prima di salvare.');
    return;
  }

  const nome = document.getElementById('nome').value.trim();
  const specie = document.getElementById('specie').value;
  const eta = document.getElementById('eta').value.trim();
  const pesoTesto = document.getElementById('peso').value;
  const carattere = document.getElementById('carattere').value.trim();
  const esigenze = document.getElementById('esigenze').value.trim();

  if (!nome) {
    alert('Inserisci il nome del tuo animale.');
    return;
  }

  const { error } = await supabaseClient
    .from('animali')
    .insert({
      proprietario_id: user.id,
      nome: nome,
      specie: specie,
      eta: eta,
      peso: pesoTesto === '' ? null : Number(pesoTesto),
      carattere: carattere,
      esigenze: esigenze
    });

  if (error) {
    alert('Errore nel salvataggio: ' + error.message);
  } else {
    alert('Animale salvato con successo! 🐾💚');
  }
});
  async function caricaAnimali() {
  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) return;

  const { data, error } = await supabaseClient
    .from('animali')
    .select('*')
    .eq('proprietario_id', user.id);

  const lista = document.getElementById('lista-animali');
  const messaggio = document.getElementById('messaggio-lista');

  if (error) {
    messaggio.textContent = 'Errore nel caricamento degli animali.';
    return;
  }

  if (!data || data.length === 0) {
    messaggio.textContent = 'Non hai ancora registrato animali.';
    return;
  }

  messaggio.textContent = '';
  lista.replaceChildren();

  data.forEach(animale => {
    const scheda = document.createElement('div');
    const nome = document.createElement('h3');
    const dettagli = document.createElement('p');

    nome.textContent = animale.nome;
    dettagli.textContent = `${animale.specie} - ${animale.eta ?? 'Non indicata'} anni | Peso: ${animale.peso ?? 'Non indicato'} kg | Carattere: ${animale.carattere || 'Non indicato'} | Esigenze: ${animale.esigenze || 'Nessuna indicazione'}`;

    scheda.append(nome, dettagli);
    lista.appendChild(scheda);
  });
}

caricaAnimali();
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrazione - Angel Zampetta Amica</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7f4;
      margin: 0;
      padding: 20px;
    }
    .contenitore {
      max-width: 420px;
      margin: 50px auto;
      padding: 28px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000015;
    }
    h1 { color: #246b51; text-align: center; }
    label { display: block; margin-top: 16px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      background: #246b51;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #messaggio { margin-top: 16px; }
  </style>
</head>
<body>
  <div class="contenitore">
    <h1>🐾 Angel Zampetta Amica</h1>
    <h2>Crea il tuo account</h2>
    <form id="registrazione">
      <label for="nome">Nome</label>
      <input id="nome" required autocomplete="name">

      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email">

      <label for="password">Password (almeno 8 caratteri)</label>
      <input id="password" type="password" minlength="8"
             required autocomplete="new-password">

      <button type="submit">Registrati</button>
    </form>
    <p id="messaggio" role="status"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = 'https://svudedpkugiehiezfupd.supabase.co';
  const supabaseKey = 'sb_publishable_g05v_CHcx1c-ua7J36IKog_nnTxaJUB';

  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  document.getElementById('registrazione').addEventListener('submit', async function (evento) {
    evento.preventDefault();

    const nome = document.getElementById('nome').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const messaggio = document.getElementById('messaggio');

    messaggio.textContent = 'Registrazione in corso...';

    const { error } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: {
        data: { nome: nome },
        emailRedirectTo: 'https://angelzampettaamica-creator.github.io/angel-zampetta-amica/registrazione.html'
      }
    });

    if (error) {
      messaggio.textContent = 'Errore: ' + error.message;
    } else {
      messaggio.textContent = 'Controlla la tua email per confermare la registrazione!';
    }
  });
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuova password - Angel Zampetta Amica</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f7f2;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .contenitore {
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #00000015;
      width: 90%;
      max-width: 420px;
      box-sizing: border-box;
    }
    h1 { color: #176b50; font-size: 27px; }
    label { display: block; margin-top: 18px; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: 0;
      border-radius: 8px;
      background: #176b50;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #messaggio { margin-top: 16px; }
    a { color: #176b50; }
  </style>
</head>
<body>
  <div class="contenitore">
    <h1>🐾 Angel Zampetta Amica</h1>
    <h2>Scegli una nuova password</h2>

    <p id="istruzioni">Verifica del collegamento di recupero...</p>

    <form id="nuovaPassword" hidden>
      <label for="password">Nuova password</label>
      <input id="password" type="password" minlength="8" required autocomplete="new-password">

      <label for="conferma">Conferma la nuova password</label>
      <input id="conferma" type="password" minlength="8" required autocomplete="new-password">

      <button type="submit">Salva nuova password</button>
    </form>

    <p id="messaggio" role="status"></p>
    <p><a href="accesso.html">Torna alla pagina di accesso</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://svudedpkugiehiezfupd.supabase.co';
    const supabaseKey = 'sb_publishable_g05v_CHcx1c-ua7J36IKog_nnTxaJUB';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    const modulo = document.getElementById('nuovaPassword');
    const istruzioni = document.getElementById('istruzioni');
    const messaggio = document.getElementById('messaggio');

    let recuperoAutorizzato = false;

    supabaseClient.auth.onAuthStateChange((evento) => {
      if (evento === 'PASSWORD_RECOVERY') {
        recuperoAutorizzato = true;
        modulo.hidden = false;
        istruzioni.textContent = 'Inserisci la nuova password.';
      }
    });

    async function verificaRecupero() {
      const parametri = new URLSearchParams(window.location.search);
      const codice = parametri.get('code');

      if (codice) {
        const { error } = await supabaseClient.auth.exchangeCodeForSession(codice);
        if (error) {
          istruzioni.textContent = 'Collegamento non valido o scaduto.';
          return;
        }
        recuperoAutorizzato = true;
      } else {
        const { data } = await supabaseClient.auth.getSession();
        recuperoAutorizzato = !!data.session &&
          (window.location.hash.includes('type=recovery'));
      }

      if (recuperoAutorizzato) {
        modulo.hidden = false;
        istruzioni.textContent = 'Inserisci la nuova password.';
      } else {
        istruzioni.textContent = 'Apri questa pagina dal collegamento ricevuto via email.';
      }
    }

    verificaRecupero();

    modulo.addEventListener('submit', async function(evento) {
      evento.preventDefault();

      if (!recuperoAutorizzato) return;

      const password = document.getElementById('password').value;
      const conferma = document.getElementById('conferma').value;

      if (password !== conferma) {
        messaggio.textContent = 'Le due password non coincidono.';
        return;
      }

      messaggio.textContent = 'Salvataggio in corso...';

      const { error } = await supabaseClient.auth.updateUser({
        password: password
      });

      if (error) {
        messaggio.textContent = 'Errore: ' + error.message;
      } else {
        await supabaseClient.auth.signOut();
        modulo.hidden = true;
        istruzioni.textContent = 'Password aggiornata!';
        messaggio.textContent = 'Ora puoi accedere con la nuova password.';
      }
    });
  </script>
</body>
</html>

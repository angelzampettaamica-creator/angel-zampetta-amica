<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Area personale - Angel Zampetta Amica</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f7f2; margin: 0; padding: 24px; }
    main { max-width: 520px; margin: 50px auto; background: white; padding: 30px; border-radius: 20px; text-align: center; }
    h1 { color: #176b52; }
    button { background: #176b52; color: white; padding: 14px 24px; border: 0; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>🐾 Angel Zampetta Amica</h1>
    <h2>La tua area personale</h2>
    <p id="messaggio">Verifica dell'accesso in corso...</p>
    <button id="esci" type="button" hidden>Esci dall'account</button>
 
<h3>🐾 Come vuoi utilizzare Angel Zampetta Amica?</h3>
<p>Scegli il tuo ruolo:</p>
<select id="ruolo">
  <option value="">Seleziona un ruolo</option>
  <option value="proprietario">🐶 Proprietario</option>
  <option value="custode">🏡 Custode</option>
  <option value="entrambi">💚 Entrambi</option>
</select>

<p>
  <button id="salva-profilo" type="button">💚 Salva il mio profilo</button>
</p>
<p id="esito-profilo"></p>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = supabase.createClient(
      'https://svudedpkugiehiezfupd.supabase.co',
      'sb_publishable_g05v_CHcx1c-ua7J36IKog_nnTxaJUB'
    );
    async function verificaAccesso() {
      const { data: { user }, error } = await supabaseClient.auth.getUser();
      if (error || !user) {
        window.location.replace('accesso.html');
        return;
      }
      document.getElementById('messaggio').textContent = 'Benvenuto! Accesso effettuato come ' + user.email;
      document.getElementById('esci').hidden = false;
    }
    document.getElementById('esci').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.replace('accesso.html');
    });
    verificaAccesso();
    
async function caricaRuolo() {
  const { data: { user }, error: erroreAccesso } =
    await supabaseClient.auth.getUser();

  if (erroreAccesso || !user) return;

  const { data, error } = await supabaseClient
    .from('profili')
    .select('ruolo')
    .eq('id', user.id)
    .maybeSingle();

  if (error) {
    console.error('Errore caricamento profilo:', error.message);
    return;
  }

  if (data && data.ruolo) {
    document.getElementById('ruolo').value = data.ruolo;
  }
}

caricaRuolo();

document.getElementById('salva-profilo').addEventListener('click', async () => {
  const messaggio = document.getElementById('esito-profilo');
  const ruolo = document.getElementById('ruolo').value;

  if (!ruolo) {
    messaggio.textContent = 'Seleziona prima un ruolo.';
    return;
  }

  messaggio.textContent = 'Salvataggio in corso...';

  const { data: { user }, error: erroreAccesso } =
    await supabaseClient.auth.getUser();

  if (erroreAccesso || !user) {
    messaggio.textContent = 'Devi effettuare l’accesso.';
    return;
  }

  const { error } = await supabaseClient
    .from('profili')
    .upsert({ id: user.id, ruolo: ruolo }, { onConflict: 'id' });

  messaggio.textContent = error
    ? 'Errore nel salvataggio: ' + error.message
    : '💚 Profilo salvato con successo!';
});

  </script>
</body>
</html>

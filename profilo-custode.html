
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profilo Custode - Angel Zampetta Amica</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4faf5;
      padding: 20px;
      color: #243b2c;
    }
    main {
      max-width: 550px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }
    h1 { color: #287b49; }
    label {
      display: block;
      margin-top: 18px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      box-sizing: border-box;
    }
   input[type="checkbox"] {
  width: auto;
  margin-right: 10px;
}
    button {
      margin-top: 20px;
      padding: 12px;
      background: #287b49;
      color: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>🐾 Profilo Custode</h1>
    <p>Raccontaci come puoi prenderti cura degli animali.</p>

    <label>Quali animali puoi accudire?</label>
    <label><input type="checkbox" id="cani" name="animali" value="Cani"> 🐶 Cani</label>
  <div id="taglie-cani" style="display:none; background:#f0f7f1; padding:15px; border:1px solid #b8d8bf; border-radius:12px; margin-top:10px;">  
<label>Taglie dei cani che posso accudire:</label>
<label><input type="checkbox" name="taglie_cani" value="Piccola"> Piccola (fino a 10 kg)</label>
<label><input type="checkbox" name="taglie_cani" value="Media"> Media (oltre 10 fino a 25 kg)</label>
<label><input type="checkbox" name="taglie_cani" value="Grande"> Grande (oltre 25 kg)</label>
    </div>

    <label><input type="checkbox" name="animali" value="Gatti"> Gatti</label>
    <label><input type="checkbox" name="animali" value="Conigli"> Conigli</label>
    <label><input type="checkbox" name="animali" value="Uccellini"> Uccellini</label>
    <label><input type="checkbox" name="animali" value="Altri piccoli animali"> Altri piccoli animali</label>

    <label for="servizio">Tipo di servizio</label>
    <select id="servizio">
      <option>Custodia a casa mia</option>
      <option>Custodia a casa del proprietario</option>
      <option>Passeggiate</option>
      <option>Più servizi</option>
    </select>

    <label for="descrizione">Presentati ai proprietari</label>
    <textarea id="descrizione" rows="5"
      placeholder="Racconta la tua esperienza con gli animali..."></textarea>

  <button id="salva-profilo" type="button">💚 Salva il mio profilo custode</button>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const cani = document.getElementById('cani');
  const taglieCani = document.getElementById('taglie-cani');
const supabaseClient = supabase.createClient(
  'https://svudedpkugiehiezfupd.supabase.co',
  'sb_publishable_g05v_CHcx1c-ua7J36IKog_nnTxaJUB'
);
  cani.addEventListener('change', function() {
    taglieCani.style.display = cani.checked ? 'block' : 'none';
  });
  document.getElementById('salva-profilo').addEventListener('click', async function() {
  const { data: { user }, error } = await supabaseClient.auth.getUser();

  if (error || !user) {
    alert('Devi effettuare l’accesso prima di salvare.');
    return;
  }
const animali = Array.from(
  document.querySelectorAll('input[name="animali"]:checked')
).map(el => el.value);
 const taglie = Array.from(document.querySelectorAll('input[name="taglie_cani"]:checked')).map(el => el.value);
  
    const servizio = document.getElementById('servizio').value;
const descrizione = document.getElementById('descrizione').value.trim();
  const { error: erroreSalvataggio } = await supabaseClient
  .from('profili_custodi')
  .upsert({
    id: user.id,
    animali: animali.join(', '),
    taglie_cani: cani.checked ? taglie.join(', ') : '',
    servizio: servizio,
    descrizione: descrizione
  }, { onConflict: 'id' });
    if (erroreSalvataggio) {
  alert('Errore nel salvataggio: ' + erroreSalvataggio.message);
} else {
  alert('Profilo custode salvato con successo! 🐾');
}
 });
</script>

</body>
</html>

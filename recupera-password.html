
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recupera password - Angel Zampetta Amica</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f7f2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .contenitore {
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #00000015;
      width: 90%;
      max-width: 420px;
      box-sizing: border-box;
    }
    h1 { color: #176b50; font-size: 27px; }
    label { display: block; margin-top: 18px; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: 0;
      border-radius: 8px;
      background: #176b50;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #messaggio { margin-top: 16px; }
    a { color: #176b50; }
  </style>
</head>
<body>
  <div class="contenitore">
    <h1>🐾 Angel Zampetta Amica</h1>
    <h2>Recupera la password</h2>

    <p>Inserisci la tua email per ricevere un collegamento con cui impostare una nuova password.</p>

    <form id="recupero">
      <label for="email">Indirizzo email</label>
      <input id="email" type="email" required autocomplete="email">
      <button type="submit">Invia email di recupero</button>
    </form>

    <p id="messaggio" role="status"></p>
    <p><a href="accesso.html">Torna alla pagina di accesso</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://svudedpkugiehiezfupd.supabase.co';
    const supabaseKey = 'sb_publishable_g05v_CHcx1c-ua7J36IKog_nnTxaJUB';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('recupero').addEventListener('submit', async function(evento) {
      evento.preventDefault();

      const email = document.getElementById('email').value.trim();
      const messaggio = document.getElementById('messaggio');

      messaggio.textContent = 'Invio in corso...';

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://angelzampettaamica-creator.github.io/angel-zampetta-amica/nuova-password.html'
      });

      if (error) {
        messaggio.textContent = 'Non è stato possibile inviare l’email. Riprova tra qualche minuto.';
      } else {
        messaggio.textContent = 'Se l’indirizzo è associato a un account, riceverai un’email con le istruzioni.';
      }
    });
  </script>
</body>
</html>
